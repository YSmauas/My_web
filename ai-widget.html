<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוזר חכם</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Heebo:wght@300;400;600&display=swap');

        :root {
            --bg-body: linear-gradient(135deg, #1e1e2f, #2a2a40); 
            --bg-panel: rgba(255,255,255,0.05); 
            --border: rgba(255,255,255,0.1);
            --text: #fff; 
            --bot-msg: rgba(0,0,0,0.3); 
            --accent: #168030;
        }
        [data-theme="light"] {
            --bg-body: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            --bg-panel: rgba(255,255,255,0.8); 
            --border: rgba(255,255,255,0.4);
            --text: #333; 
            --bot-msg: rgba(255,255,255,0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: transparent; }

        /* Widget Container */
        .app { 
            position: fixed; bottom: 90px; right: 20px; width: 380px; height: 600px; max-height: 80vh; max-width: calc(100vw - 40px); 
            background: var(--bg-panel); border: 1px solid var(--border); display: flex; flex-direction: column; z-index: 9999; 
            transform-origin: bottom right; transform: scale(0); opacity: 0; pointer-events: none; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(16px); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border-radius: 16px; overflow: hidden; 
        }
        .app.open { transform: scale(1); opacity: 1; pointer-events: auto; }
        
        .widget-toggle { 
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; 
            background: var(--accent); color: white; border: none; font-size: 24px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10000; display: flex; justify-content: center; align-items: center; transition: 0.3s; 
        }
        .widget-toggle:hover { transform: scale(1.1); }

        /* Header */
        .header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.05); }
        .header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 10px; color: var(--text); }
        .header h2 i { color: var(--accent); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { background: transparent; border: none; color: var(--text); font-size: 1.1rem; cursor: pointer; transition: 0.3s; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: rgba(128,128,128,0.2); color: var(--accent); }

        /* Chat Area */
        .chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 5; }
        
        .msg-wrapper { display: flex; width: 100%; align-items: flex-end; gap: 8px; }
        .user-wrapper { justify-content: flex-start; }
        .bot-wrapper { justify-content: flex-end; }
        
        .msg { max-width: 85%; padding: 12px 18px; font-size: 0.95rem; line-height: 1.5; animation: slideUp 0.3s ease; word-wrap: break-word; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user { background: var(--accent); color: #fff; border-radius: 18px 18px 4px 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .bot { background: var(--bot-msg); color: var(--text); border-radius: 18px 18px 18px 4px; border: 1px solid var(--border); }

        /* Formatted Content Styles inside Chat */
        .msg h1, .msg h2, .msg h3 { margin-top: 8px; margin-bottom: 4px; font-weight: 700; color: inherit; }
        .msg h1 { font-size: 1.15rem; }
        .msg h2 { font-size: 1.05rem; }
        .msg h3 { font-size: 0.98rem; }
        .msg strong { font-weight: 700; color: #10b981; }
        .msg code { background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.88rem; }

        .msg-copy-btn { background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 1rem; opacity: 0.5; transition: 0.2s; display: flex; align-items: center; justify-content: center; padding: 5px; flex-shrink: 0; }
        .msg-copy-btn:hover { opacity: 1; color: var(--accent); transform: scale(1.1); }

        /* Input Bar */
        .input-bar { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: rgba(0,0,0,0.03); align-items: center; }
        .input-box { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s; }
        .input-box:focus { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; }
        .main-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; transition: 0.2s; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .main-btn:hover { transform: scale(1.05); }
        .main-btn.btn-cancel { background: #ef4444 !important; }
    </style>
</head>
<body>

    <button class="widget-toggle" id="widgetToggle"><i class="fa-solid fa-comment-dots"></i></button>

    <div class="app" id="appContainer">
        <div class="header">
            <h2><i class="fa-solid fa-sparkles"></i> עוזר חכם</h2>
            <div class="header-actions">
                <button class="icon-btn" id="clearChatBtn" title="איפוס שיחה"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="icon-btn" id="themeToggle" title="יום/לילה"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn" id="closeWidget"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-bar">
            <input type="text" class="input-box" id="input" placeholder="כתוב הודעה בנושאי אנדרואיד ופיתוח...">
            <button class="main-btn" id="btnSend"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const WELCOME_MSG = "שלום! ניתן להקליד הודעה כדי לשוחח איתי בנושאי אנדרואיד ופיתוח.";
        let chatHistory = [];
        let currentAbortController = null;

        const appContainer = document.getElementById('appContainer');
        const widgetToggle = document.getElementById('widgetToggle');
        const closeWidget = document.getElementById('closeWidget');
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const btnSend = document.getElementById('btnSend');
        const themeToggle = document.getElementById('themeToggle');
        const clearChatBtn = document.getElementById('clearChatBtn');

        // פונקציית פירסור עיצוב טקסט (Markdown: כותרות, דגשים, קוד ושורות חדשות)
        function parseMarkdown(text) {
            if (!text) return '';
            let html = text;
            
            // המרת תגיות אבטחה בסיסיות
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // כותרות
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // דגשים (**מודגש**)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // קוד קצר (`code`)
            html = html.replace(/`(.*?)`/g, '<code>$1</code>');
            
            // ירידות שורה
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        // ניהול פתיחת/סגירת הווידג'ט
        if (widgetToggle) {
            widgetToggle.onclick = () => {
                appContainer.classList.toggle('open');
                widgetToggle.innerHTML = appContainer.classList.contains('open') ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-comment-dots"></i>';
            };
            if(closeWidget) closeWidget.onclick = () => { 
                appContainer.classList.remove('open'); 
                widgetToggle.innerHTML = '<i class="fa-solid fa-comment-dots"></i>'; 
            };
        }

        // מצב יום/לילה
        let isLight = false;
        if (themeToggle) {
            themeToggle.onclick = () => {
                isLight = !isLight; 
                document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
                themeToggle.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            };
        }

        // הוספת הודעה לחלון הצ'אט
        function append(rawTxt, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper ' + type + '-wrapper';
            
            const div = document.createElement('div'); 
            div.className = 'msg ' + type; 
            
            // אם זה הבוט, אנחנו מפעילים את הפירסור של העיצוב
            if (type === 'bot') {
                div.innerHTML = parseMarkdown(rawTxt);
            } else {
                div.textContent = rawTxt;
            }
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg-copy-btn';
            copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
            copyBtn.title = 'העתק הודעה';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(rawTxt).then(() => {
                    copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 2000);
                });
            };
            
            if (type === 'user') {
                wrapper.appendChild(div);
                wrapper.appendChild(copyBtn);
            } else {
                wrapper.appendChild(copyBtn);
                wrapper.appendChild(div);
            }
            
            chat.appendChild(wrapper); 
            chat.scrollTop = chat.scrollHeight; 
            return wrapper;
        }

        function refreshChatUI() {
            chat.innerHTML = '';
            if (chatHistory.length > 0) {
                chatHistory.forEach(item => {
                    const sender = item.role === 'user' ? 'user' : 'bot';
                    append(item.parts[0]?.text || '', sender);
                });
            } else if (WELCOME_MSG) {
                append(WELCOME_MSG, 'bot');
            }
        }

        function saveHistory() {
            localStorage.setItem('biz_chat_history', JSON.stringify(chatHistory));
        }

        function loadHistory() {
            const saved = localStorage.getItem('biz_chat_history');
            if (saved) {
                try { chatHistory = JSON.parse(saved); } catch(e) { chatHistory = []; }
            }
            refreshChatUI();
        }

        if (clearChatBtn) {
            clearChatBtn.onclick = () => {
                if(confirm("האם ברצונך לאפס את השיחה?")) {
                    chatHistory = [];
                    localStorage.removeItem('biz_chat_history');
                    refreshChatUI();
                }
            };
        }

        function setSendingState(isSending) {
            if (isSending) {
                btnSend.innerHTML = '<i class="fa-solid fa-stop"></i>';
                btnSend.classList.add('btn-cancel');
                btnSend.title = "בטל שליחה";
            } else {
                btnSend.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                btnSend.classList.remove('btn-cancel');
                btnSend.title = "שלח";
                currentAbortController = null;
            }
        }

        // שליחת הודעה בצורה מאובטחת דרך Vercel Serverless Function
        async function sendMsg() {
            if (currentAbortController) {
                currentAbortController.abort();
                setSendingState(false);
                append("הפעולה בוטלה על ידי המשתמש", 'bot');
                return;
            }

            const txt = input.value.trim();
            if(!txt) return;

            append(txt, 'user'); 
            input.value = ''; 
            chatHistory.push({ role: 'user', parts: [{ text: txt }] });
            saveHistory(); 

            const loadWrapper = append("מקליד...", 'bot'); loadWrapper.style.opacity = '0.5';
            
            currentAbortController = new AbortController();
            setSendingState(true);

            try {
                // פנייה לקובץ השרת שבנינו ב-Vercel
                const res = await fetch('/api/get-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory }),
                    signal: currentAbortController.signal
                });

                const data = await res.json();
                loadWrapper.remove();
                setSendingState(false);

                if(!res.ok || data.error) throw new Error(data.error || "שגיאה בתגובת השרת");

                const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "לא התקבלה תשובה תקנית מהשרת.";
                
                append(replyText, 'bot');
                chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
                saveHistory();

            } catch(e) { 
                loadWrapper.remove(); 
                setSendingState(false);
                if (e.name !== 'AbortError') {
                    append("שגיאה: " + e.message, 'bot'); 
                }
            }
        }

        btnSend.onclick = () => sendMsg();
        input.onkeypress = e => { if(e.key === 'Enter') sendMsg(); };

        window.onload = () => {
            loadHistory();
        };
    </script>
</body>
</html>
