<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח ניהול - ההודעות</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-header h1 {
            color: #333;
            font-size: 28px;
        }

        .admin-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f5f5;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .stat-item i {
            color: #667eea;
            font-size: 20px;
        }

        .stat-item span {
            font-weight: bold;
            color: #333;
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: #ff6b6b;
            color: white;
        }

        .btn-clear:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-export {
            background: #51cf66;
            color: white;
        }

        .btn-export:hover {
            background: #40c057;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: #ff922b;
            color: white;
        }

        .btn-logout:hover {
            background: #fd7e14;
            transform: translateY(-2px);
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section input {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .messages-container {
            display: grid;
            gap: 20px;
        }

        .message-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .message-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-sender {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sender-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sender-name {
            font-weight: bold;
            font-size: 16px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.9;
        }

        .message-delete {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .message-delete:hover {
            background: rgba(255,255,255,0.4);
        }

        .message-body {
            padding: 20px;
        }

        .message-email {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-text {
            color: #555;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .empty-state {
            background: white;
            padding: 60px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .empty-state i {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #999;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #bbb;
        }

        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-container button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff6b6b;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffe0e0;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
            }

            .message-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-section input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Panel -->
    <div id="loginPanel" class="login-container">
        <h1><i class="fas fa-lock"></i> לוח ניהול</h1>
        <div class="error-message" id="errorMessage"></div>
        <input type="password" id="passwordInput" placeholder="הכנס סיסמה" autocomplete="off">
        <button onclick="login()"><i class="fas fa-sign-in-alt"></i> כניסה</button>
        <p style="margin-top: 20px; color: #999; font-size: 12px;">הסיסמה היא: <strong>admin123</strong></p>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-header">
            <div>
                <h1><i class="fas fa-chart-bar"></i> לוח הניהול שלך</h1>
            </div>
            <div class="admin-stats">
                <div class="stat-item">
                    <i class="fas fa-envelope"></i>
                    <span>סה"כ הודעות: <strong id="totalMessages">0</strong></span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-calendar"></i>
                    <span>היום: <strong id="todayMessages">0</strong></span>
                </div>
            </div>
            <div class="admin-controls">
                <button class="btn btn-export" onclick="exportToJSON()">
                    <i class="fas fa-download"></i> ייצוא
                </button>
                <button class="btn btn-clear" onclick="clearAllMessages()">
                    <i class="fas fa-trash"></i> מחק הכל
                </button>
                <button class="btn btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> התנתקות
                </button>
            </div>
        </div>

        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="חפש לפי שם, דוא״ל או הודעה..." onkeyup="filterMessages()">
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be displayed here -->
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const MESSAGES_KEY = 'contactMessages';

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                showAdminPanel();
            }
        });

        function login() {
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showAdminPanel();
                errorMessage.style.display = 'none';
            } else {
                errorMessage.textContent = '❌ סיסמה שגויה!';
                errorMessage.style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            if (confirm('האם אתה בטוח שברצונך להתנתק?')) {
                sessionStorage.removeItem('adminLoggedIn');
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('loginPanel').style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }

        function showAdminPanel() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadMessages();
        }

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            const container = document.getElementById('messagesContainer');
            const totalMessages = document.getElementById('totalMessages');
            const todayMessages = document.getElementById('todayMessages');

            totalMessages.textContent = messages.length;

            const today = new Date().toDateString();
            const todayCount = messages.filter(m => new Date(m.timestamp).toDateString() === today).length;
            todayMessages.textContent = todayCount;

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h2>אין הודעות עדיין</h2>
                        <p>כל הודעה שתתקבל תופיע כאן</p>
                    </div>
                `;
                return;
            }

            const sortedMessages = messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            container.innerHTML = sortedMessages.map((msg, index) => {
                const date = new Date(msg.timestamp);
                const formattedDate = date.toLocaleDateString('he-IL', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const initials = msg.name.split(' ').map(n => n[0]).join('').toUpperCase();

                return `
                    <div class="message-card">
                        <div class="message-header">
                            <div class="message-sender">
                                <div class="sender-avatar">${initials}</div>
                                <div>
                                    <div class="sender-name">${escapeHtml(msg.name)}</div>
                                    <div class="message-time">${formattedDate}</div>
                                </div>
                            </div>
                            <button class="message-delete" onclick="deleteMessage(${index})">
                                <i class="fas fa-trash"></i> מחק
                            </button>
                        </div>
                        <div class="message-body">
                            <div class="message-email">
                                <i class="fas fa-envelope"></i>
                                ${escapeHtml(msg.email)}
                            </div>
                            <div class="message-text">${escapeHtml(msg.message)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterMessages() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            const sortedMessages = messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            const filtered = sortedMessages.filter(msg => 
                msg.name.toLowerCase().includes(searchTerm) ||
                msg.email.toLowerCase().includes(searchTerm) ||
                msg.message.toLowerCase().includes(searchTerm)
            );

            const container = document.getElementById('messagesContainer');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h2>לא נמצאו הודעות</h2>
                        <p>נסה חיפוש אחר</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((msg, index) => {
                const originalIndex = messages.indexOf(msg);
                const date = new Date(msg.timestamp);
                const formattedDate = date.toLocaleDateString('he-IL', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const initials = msg.name.split(' ').map(n => n[0]).join('').toUpperCase();

                return `
                    <div class="message-card">
                        <div class="message-header">
                            <div class="message-sender">
                                <div class="sender-avatar">${initials}</div>
                                <div>
                                    <div class="sender-name">${escapeHtml(msg.name)}</div>
                                    <div class="message-time">${formattedDate}</div>
                                </div>
                            </div>
                            <button class="message-delete" onclick="deleteMessage(${originalIndex})">
                                <i class="fas fa-trash"></i> מחק
                            </button>
                        </div>
                        <div class="message-body">
                            <div class="message-email">
                                <i class="fas fa-envelope"></i>
                                ${escapeHtml(msg.email)}
                            </div>
                            <div class="message-text">${escapeHtml(msg.message)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteMessage(index) {
            if (confirm('האם אתה בטוח שברצונך למחוק הודעה זו?')) {
                const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
                messages.splice(index, 1);
                localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
                loadMessages();
            }
        }

        function clearAllMessages() {
            if (confirm('⚠️ זה ימחק את כל ההודעות! האם אתה בטוח?')) {
                localStorage.removeItem(MESSAGES_KEY);
                loadMessages();
            }
        }

        function exportToJSON() {
            const messages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
            const dataStr = JSON.stringify(messages, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `messages-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to login
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('passwordInput');
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
