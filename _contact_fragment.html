<!-- Contact Section -->
<section id="contact" class="contact">
  <div class="container">
    <div class="section-header">
      <h2>יצירת קשר</h2>
      <p class="section-subtitle">יש לך שאלה או בקשה מיוחדת? נשמח לשמוע ממך</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info glass-card">
        <div class="contact-item">
          <div class="icon-wrap"><i class="fas fa-envelope"></i></div>
          <div>
            <h4>דוא״ל</h4>
            <a href="mailto:ysrlmyrmws1@gmail.com">ysrlmyrmws1@gmail.com</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="icon-wrap"><i class="fas fa-phone"></i></div>
          <div>
            <h4>טלפון</h4>
            <a href="tel:0556747686">0556747686</a>
          </div>
        </div>
      </div>

      <form id="contact-form" action="https://formspree.io/f/xbdnqqla" method="POST" class="contact-form glass-card" novalidate>
        <div class="form-group">
          <input type="text" name="name" placeholder="שם מלא" required>
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="כתובת דוא״ל" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="איך אפשר לעזור לך?..." rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-paper-plane"></i> שלח הודעה
        </button>
      </form>
    </div>
  </div>
</section>
